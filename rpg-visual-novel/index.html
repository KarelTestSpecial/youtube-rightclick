<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Velmara — De Fluisterende Poort</title>
  <meta name="description" content="Een sfeervolle, verhalende fantasy visual novel / RPG-prototype." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23e6c27a'/%3E%3Cpath d='M32 10 L38 32 L32 54 L26 32 Z' fill='%231a1630'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game" class="is-title">

    <!-- ===== Achtergrond (2 lagen voor crossfade) ===== -->
    <div id="bg-wrap" aria-hidden="true">
      <div class="bg-layer"></div>
      <div class="bg-layer"></div>
      <div id="bg-shade"></div>
    </div>

    <!-- ===== Personages ===== -->
    <div id="stage" aria-hidden="true"></div>

    <!-- Bestandsnaam-label van de achtergrond-placeholder -->
    <div id="bg-badge" class="ph-badge" hidden></div>

    <!-- ===== HUD ===== -->
    <header id="hud">
      <div id="loc-pill">
        <span id="loc-name">—</span>
        <span id="chapter-name"></span>
      </div>
      <nav id="hud-buttons" aria-label="Spelmenu">
        <button class="hud-btn" data-action="map"      data-key="M" title="Kaart (M)"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14"/></svg><span>Kaart</span></button>
        <button class="hud-btn" data-action="inventory" data-key="I" title="Tas (I)"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8Zm3 0V6a3 3 0 0 1 6 0v2"/></svg><span>Tas</span></button>
        <button class="hud-btn" data-action="journal"  data-key="J" title="Dagboek (J)"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Zm0 13a3 3 0 0 1 3-3h11M9 8h6"/></svg><span>Dagboek</span><i class="dot" id="journal-dot" hidden></i></button>
        <button class="hud-btn" data-action="log"      data-key="L" title="Geschiedenis (L)"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Log</span></button>
        <button class="hud-btn" data-action="save"     title="Opslaan"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5V4Zm3 0v5h7V4M8 20v-6h8v6"/></svg><span>Opslaan</span></button>
        <button class="hud-btn" data-action="load"     title="Laden"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg><span>Laden</span></button>
        <button class="hud-btn" data-action="settings" title="Instellingen"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm7.4-3a7.4 7.4 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14.5 3h-5l-.4 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7.4 7.4 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2l.4 2.6h5l.4-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z"/></svg><span>Opties</span></button>
        <button class="hud-btn" data-action="hide"     data-key="H" title="Verberg interface (H)"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Zm10 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg><span>Bekijk</span></button>
        <button class="hud-btn" data-action="menu"     title="Hoofdmenu"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7M5 10v10h14V10"/></svg><span>Menu</span></button>
      </nav>
    </header>

    <!-- ===== Keuzes ===== -->
    <div id="choices" role="group" aria-label="Keuzes"></div>

    <!-- ===== Dialoogvenster ===== -->
    <section id="dialogue" aria-live="polite">
      <div id="nameplate" hidden></div>
      <div id="text"></div>
      <div id="hub-actions"></div>
      <div id="dlg-controls">
        <button data-action="auto" id="btn-auto" title="Automatisch doorspelen (A)">Auto</button>
        <button data-action="skip" id="btn-skip" title="Snel doorspoelen tot de volgende keuze (S)">Skip</button>
        <button data-action="log" title="Geschiedenis (L)">Log</button>
      </div>
      <div id="advance" aria-hidden="true"></div>
    </section>

    <!-- ===== Zijbalk: Tas / Dagboek / Relaties ===== -->
    <aside id="drawer" aria-hidden="true">
      <div class="drawer-head">
        <div class="tabs" role="tablist">
          <button class="tab" data-tab="inventory">Tas</button>
          <button class="tab" data-tab="journal">Dagboek</button>
          <button class="tab" data-tab="relations">Relaties</button>
        </div>
        <button class="icon-close" data-action="close-drawer" aria-label="Sluiten">×</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <!-- ===== Modals ===== -->
    <div id="modal" class="overlay" hidden>
      <div class="modal-card" role="dialog" aria-modal="true">
        <button class="icon-close" data-action="close-modal" aria-label="Sluiten">×</button>
        <div id="modal-content"></div>
      </div>
    </div>

    <!-- ===== Hoofdstukkaart ===== -->
    <div id="title-card" class="overlay" hidden>
      <div class="tc-inner">
        <div class="tc-orn"></div>
        <h2 id="tc-title"></h2>
        <p id="tc-sub"></p>
        <div class="tc-orn"></div>
      </div>
    </div>

    <!-- ===== Titelscherm ===== -->
    <div id="title-screen" class="overlay">
      <div class="ts-inner">
        <p class="ts-kicker">Een verhalend avontuur</p>
        <h1 id="ts-title">Velmara</h1>
        <p id="ts-sub">De Fluisterende Poort</p>
        <div class="ts-menu">
          <button class="btn-primary" data-action="new-game">Nieuw verhaal</button>
          <button class="btn-ghost" data-action="continue" id="btn-continue">Verder spelen</button>
          <button class="btn-ghost" data-action="load">Laden</button>
          <button class="btn-ghost" data-action="settings">Instellingen</button>
        </div>
        <p class="ts-foot" id="ts-foot"></p>
      </div>
    </div>

    <!-- ===== Eindscherm ===== -->
    <div id="ending-screen" class="overlay" hidden>
      <div class="end-inner">
        <p class="end-kicker">Einde</p>
        <h1 id="end-title"></h1>
        <p id="end-sub"></p>
        <div id="end-text"></div>
        <div id="end-stats"></div>
        <div class="end-actions">
          <button class="btn-primary" data-action="to-title">Terug naar titelscherm</button>
          <button class="btn-ghost" data-action="load">Laad een opslag</button>
        </div>
      </div>
    </div>

    <div id="toasts" aria-live="polite"></div>
    <div id="fade"></div>
    <div id="flash"></div>
  </div>

  <!-- Volgorde is belangrijk: eerst de data, dan assets, dan de engine. -->
  <script src="js/storyData.js"></script>
  <script src="js/validator.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
